[package]
name = "weather"
version = "0.12.0"
authors = ["Michał Bałabanow <m.balabanow@gmail.com>"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4" }
clap = { version = "4.5", features = ["derive"] }
humantime = "2.3"
image = { version = "0.25", default-features = false }
log = { version = "0.4", features = ["std"] }
omni-led-api = { path = "../../omni-led-api" }
omni-led-derive = { path = "../../omni-led-derive", features = [
    "plugin-entry",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.1", default-features = false, features = [
    "json",
    "rustls",
] }
